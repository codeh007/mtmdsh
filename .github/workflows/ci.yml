name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec turbo run //#format-and-lint

      - name: Check workspace
        run: pnpm exec turbo run build typecheck test

      - name: Pack publishable packages
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/packages"
          mkdir -p "$pack_dir"
          for package_json in packages/*/package.json; do
            if node -e 'const fs = require("node:fs"); process.exit(JSON.parse(fs.readFileSync(process.argv[1])).private ? 0 : 1)' "$package_json"; then
              continue
            fi
            package_dir="${package_json%/package.json}"
            (cd "$package_dir" && npm pack --ignore-scripts --pack-destination "$pack_dir")
          done

      - name: Lint package metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/packages"/*.tgz)
          test "${#tarballs[@]}" -gt 0
          for tarball in "${tarballs[@]}"; do
            pnpm dlx publint@0.3.24 run "$tarball" --strict
          done
