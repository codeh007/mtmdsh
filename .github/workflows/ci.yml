name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check workspace
        run: pnpm check

      - name: Pack mtmharness bundle
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtmharness"
          mkdir -p "$pack_dir"
          pnpm --filter mtmharness pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtmharness-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Lint mtmharness package metadata
        run: pnpm dlx publint run "${{ steps.pack.outputs.tarball }}" --strict
