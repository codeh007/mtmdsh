name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check workspace
        run: pnpm check

      - name: Pack codebase-memory bundle
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtm-codebase-memory"
          mkdir -p "$pack_dir"
          pnpm --filter mtm-codebase-memory pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtm-codebase-memory-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify tarball contract
        run: node scripts/verify-package.mjs packages/mtm-codebase-memory "${{ steps.pack.outputs.tarball }}"

      - name: Lint package metadata
        run: pnpm dlx publint run "${{ steps.pack.outputs.tarball }}" --strict

      - name: Rehearse npm publication
        if: ${{ matrix.node == '22.19.0' }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --dry-run --access public --ignore-scripts

      - name: Pack mtmcanvas plugin
        id: pack_mtmcanvas
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtmcanvas"
          mkdir -p "$pack_dir"
          pnpm --filter mtmcanvas pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtmcanvas-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify mtmcanvas tarball contract
        run: node packages/mtmcanvas/scripts/verify-package.mjs "${{ steps.pack_mtmcanvas.outputs.tarball }}"

      - name: Lint mtmcanvas package metadata
        run: pnpm dlx publint run "${{ steps.pack_mtmcanvas.outputs.tarball }}"

      - name: Install mtmcanvas into an isolated DSH Web profile
        if: ${{ matrix.node == '22.19.0' }}
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-mtmcanvas
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 plugin --profile web add "${{ steps.pack_mtmcanvas.outputs.tarball }}"
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/mtmcanvas-dump-config.txt"
          grep -F '# == mtmcanvas' "$RUNNER_TEMP/mtmcanvas-dump-config.txt"
          grep -F 'name: mtmcanvas' "$RUNNER_TEMP/mtmcanvas-dump-config.txt"

      - name: Rehearse mtmcanvas npm publication
        if: ${{ matrix.node == '22.19.0' }}
        run: npm publish "${{ steps.pack_mtmcanvas.outputs.tarball }}" --dry-run --access public --ignore-scripts

      - name: Pack mtmharness plugin
        id: pack_mtmharness
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtmharness"
          mkdir -p "$pack_dir"
          pnpm --filter mtmharness pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtmharness-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify mtmharness tarball contract
        run: node packages/mtmharness/scripts/verify-package.mjs "${{ steps.pack_mtmharness.outputs.tarball }}"

      - name: Lint mtmharness package metadata
        run: pnpm dlx publint run "${{ steps.pack_mtmharness.outputs.tarball }}"

      - name: Install mtmharness into an isolated DSH Web profile
        if: ${{ matrix.node == '22.19.0' }}
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-mtmharness
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 plugin --profile web add "${{ steps.pack_mtmharness.outputs.tarball }}"
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/mtmharness-dump-config.txt"
          grep -F '# == mtmharness' "$RUNNER_TEMP/mtmharness-dump-config.txt"
          grep -F 'name: mtmharness' "$RUNNER_TEMP/mtmharness-dump-config.txt"

      - name: Rehearse mtmharness npm publication
        if: ${{ matrix.node == '22.19.0' }}
        run: npm publish "${{ steps.pack_mtmharness.outputs.tarball }}" --dry-run --access public --ignore-scripts

      - name: Pack mtm-connect plugin
        id: pack_mtm_connect
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtm-connect"
          mkdir -p "$pack_dir"
          pnpm --filter mtm-connect pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtm-connect-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify mtm-connect tarball contract
        run: node packages/mtm-connect/scripts/verify-package.mjs "${{ steps.pack_mtm_connect.outputs.tarball }}"

      - name: Lint mtm-connect package metadata
        run: pnpm dlx publint run "${{ steps.pack_mtm_connect.outputs.tarball }}"

      - name: Install mtm-connect into an isolated DSH Web profile
        if: ${{ matrix.node == '22.19.0' }}
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-mtm-connect
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 plugin --profile web add "${{ steps.pack_mtm_connect.outputs.tarball }}"
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/mtm-connect-dump-config.txt"
          grep -F '# == mtm-connect' "$RUNNER_TEMP/mtm-connect-dump-config.txt"
          grep -F 'name: mtm-connect' "$RUNNER_TEMP/mtm-connect-dump-config.txt"

      - name: Rehearse mtm-connect npm publication
        if: ${{ matrix.node == '22.19.0' }}
        run: npm publish "${{ steps.pack_mtm_connect.outputs.tarball }}" --dry-run --access public --ignore-scripts
