name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec turbo run //#format-and-lint

      - name: Check workspace
        run: pnpm exec turbo run build typecheck test

      - name: Pack mtmharness bundle
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtmharness"
          mkdir -p "$pack_dir"
          pnpm --filter mtmharness exec npm pack --ignore-scripts --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtmharness-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Pack mtmcanvas bundle
        id: pack-canvas
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtmcanvas"
          mkdir -p "$pack_dir"
          pnpm --filter mtmcanvas exec npm pack --ignore-scripts --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name 'mtmcanvas-*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Lint package metadata
        run: |
          pnpm dlx publint@0.3.24 run "${{ steps.pack.outputs.tarball }}" --strict
          pnpm dlx publint@0.3.24 run "${{ steps.pack-canvas.outputs.tarball }}" --strict
