name: release-mtmcanvas
run-name: Release mtmcanvas ${{ github.ref_name }}

on:
  push:
    tags:
      - 'mtmcanvas-v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mtmcanvas-npm-publish
  cancel-in-progress: false

env:
  PACKAGE_NAME: mtmcanvas
  TAG_PREFIX: mtmcanvas-v

jobs:
  publish:
    name: Pack, publish, and read back mtmcanvas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = 11.7.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/mtmcanvas/package.json').version")"
          test "$RELEASE_TAG" = "${TAG_PREFIX}${package_version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'PACKAGE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"

      - name: Check mtmcanvas browser extension
        run: pnpm exec turbo run build typecheck test --filter=mtmcanvas

      - name: Pack release tarball
        id: pack
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/mtmcanvas"
          mkdir -p "$pack_dir"
          pnpm --filter mtmcanvas exec npm pack --ignore-scripts --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name "${PACKAGE_NAME}-*.tgz" -print -quit)"
          test -n "$tarball"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          printf 'LOCAL_INTEGRITY=%s\n' "$local_integrity" >> "$GITHUB_ENV"

      - name: Verify browser extension tarball
        run: |
          set -euo pipefail
          entries="$(tar -tzf "${{ steps.pack.outputs.tarball }}")"
          if grep -Eq '^package/(cordis\.patch\.yml|lib/(index|client)\.cjs)$' <<<"$entries"; then
            echo "mtmcanvas tarball contains mtmharness-only files" >&2
            exit 1
          fi
          grep -qx 'package/lib/client.js' <<<"$entries"
          unpack="$RUNNER_TEMP/mtmcanvas-unpack"
          mkdir -p "$unpack"
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C "$unpack"
          for declaration in package/lib/types/index.d.ts package/lib/types/client/index.d.ts; do test -f "$unpack/$declaration"; done
          export UNPACK_ROOT="$unpack"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const root = process.env.UNPACK_ROOT; const pkg = JSON.parse(fs.readFileSync(path.join(root, "package/package.json"), "utf8")); if (pkg.dsh !== undefined || pkg.exports?.["."]?.import !== "./lib/client.js" || pkg.exports?.["./client"]?.import !== "./lib/client.js") process.exit(1);'
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const source = fs.readFileSync(path.join(process.env.UNPACK_ROOT, "package/lib/client.js"), "utf8"); const imports = [...source.matchAll(/(?:^|\n)\s*import(?:[^"\n]*from\s+)?["\x27]([^"\x27]+)["\x27]/g)].map((match) => match[1]); if (!source.includes("export") || imports.some((specifier) => specifier !== "react" && !specifier.startsWith("react/"))) process.exit(1);'

      - name: Lint package metadata
        run: pnpm dlx publint@0.3.24 run "${{ steps.pack.outputs.tarball }}" --strict

      - name: Preflight registry and token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${NODE_AUTH_TOKEN:-}"
          npm whoami --registry=https://registry.npmjs.org >/dev/null
          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${PACKAGE_NAME}/${PACKAGE_VERSION}")"
          test "$status" = 404

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --ignore-scripts

      - name: Read back npm integrity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if published_integrity="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity --json 2>/dev/null | jq -r .)" && published_version="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json 2>/dev/null | jq -r .)" && test "$published_integrity" = "$LOCAL_INTEGRITY" && test "$published_version" = "$PACKAGE_VERSION"; then
              break
            fi
            if test "$attempt" -eq 12; then
              echo "npm registry read-back did not converge after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 5
          done
          {
            echo '### npm release evidence'
            echo
            echo "- package: ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            echo "- tag: ${GITHUB_REF_NAME}"
            echo "- integrity: ${published_integrity}"
            echo '- provenance: requested with npm publish --provenance'
          } >> "$GITHUB_STEP_SUMMARY"
